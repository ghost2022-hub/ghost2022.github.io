    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      color: #1f2933;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #e4e7eb;
      margin-bottom: 24px;
      background: #e4e7eb;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .tagline {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .email {
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 28px;
      word-break: break-all;
    }

    .email:hover {
      text-decoration: underline;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f4f5f7;
      border: 1px solid #e4e7eb;
      color: #4b5563;
      transition: all 0.2s ease;
    }

    .socials a:hover {
      background: #1f2933;
      border-color: #1f2933;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .socials svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    footer {
      margin-top: 32px;
      color: #9aa5b1;
      font-size: 0.8rem;
    }
  </style>
